[package]
name = "utopia-mongo"
description = "MongoDB client: commands, CRUD, indexes, sessions and transactions with causal consistency, on the official driver."
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "BSD-3-Clause"

[dependencies]
base64 = "0.22"
bson = { version = "3.1", features = ["serde_json-1"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await-macro"] }
getrandom = "0.3"
hex = "0.4"
hmac = "0.12"
mongodb = { version = "3.9", default-features = false, features = ["compat-3-3-0", "bson-3", "rustls-tls"] }
php-std = { version = "0.1.0", git = "https://github.com/utopia-rs/php-std" }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "rt"] }

[package.metadata.utopia]
category = "data"